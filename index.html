<style>
:root{
  --ground:#E3E6E1;
  --paper:#F5F6F2;
  --linen:#D6DBD3;
  --ink:#1E2629;
  --sub:#5D676A;
  --line:#CDD2CB;
  --indigo:#2F4A6B;
  --indigo-pale:#DCE3EA;
  --warm:#9A4A3E;
  --num:"Archivo", "Zen Kaku Gothic New", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink)}
body{
  font-family:"Zen Kaku Gothic New", system-ui, sans-serif;
  font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:6px}
.app{max-width:460px;margin:0 auto;padding:0 14px calc(env(safe-area-inset-bottom) + 40px)}

/* header + period tabs (sticky) */
.head{position:sticky;top:0;z-index:5;background:var(--ground);padding:calc(env(safe-area-inset-top) + 8px) 0 8px;margin:0 -14px;padding-left:14px;padding-right:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.place{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:0}
.place b{font-size:20px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.place b::after{content:"";display:inline-block;width:6px;height:6px;margin-left:8px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-4px) rotate(45deg)}
.place span{font-size:12px;color:var(--sub)}
.iconbtn{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--paper)}
.iconbtn svg{width:19px;height:19px}
.ptabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border-radius:14px;padding:4px;gap:4px}
.ptabs button{padding:8px 0;border-radius:10px;font-size:15px;font-weight:700;color:var(--sub);transition:background .2s,color .2s}
.ptabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* main card */
.card{background:var(--paper);border-radius:20px;padding:10px 12px 10px}
.when{font-size:12px;color:var(--sub);margin:0 2px 4px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}
.left{min-width:0}
.wxhead{display:flex;align-items:center;gap:8px}
.wxhead svg{width:42px;height:42px;flex:none}
.wxhead .label{font-size:15px;font-weight:700;line-height:1.3}
.temps{display:grid;grid-template-columns:1fr 1fr;margin:4px 0 8px}
.temps div{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 3px}
.temps b{font-family:var(--num);font-stretch:70%;font-weight:400;font-size:34px;line-height:1;letter-spacing:-.01em}
.temps .lo b{color:var(--sub);font-weight:300}
.temps small{font-family:var(--num);font-stretch:85%;font-size:12px;color:var(--sub)}
.temps small.up{color:var(--warm)} .temps small.dn{color:var(--indigo)}
.temps .cap{width:100%;font-family:inherit;font-size:11px;color:var(--sub);margin:0 0 2px}
.stats{display:grid;grid-template-columns:1fr 1fr;margin:0;border-top:1px solid var(--line)}
.stats div{padding:4px 2px 3px;border-bottom:1px solid var(--line)}
.stats div:nth-child(odd){border-right:1px solid var(--line);padding-right:8px}
.stats div:nth-child(even){padding-left:10px}
.stats dt{font-size:11px;color:var(--sub);line-height:1.2}
.stats dd{margin:0;font-family:var(--num);font-stretch:80%;font-size:17px;font-weight:500;line-height:1.2}
.stats dd small{font-size:12px;font-weight:400;margin-left:1px}
.stats .pop dd{color:var(--indigo)}

.lay{position:relative;display:block;width:100%;border-radius:14px;overflow:hidden;background:var(--linen)}
.lay svg{display:block;width:100%;height:100%}
.lay .more{position:absolute;right:6px;bottom:6px;background:rgba(245,246,242,.92);border-radius:999px;padding:2px 9px 2px 10px;font-size:11px;color:var(--ink);display:flex;align-items:center;gap:3px}
.lay .more::after{content:"";width:5px;height:5px;border-right:1.5px solid var(--ink);border-top:1.5px solid var(--ink);transform:rotate(45deg)}

.comment{margin:8px 0 0;background:var(--ground);border-radius:12px;padding:7px 10px;font-size:13px;line-height:1.55}
.comment p{margin:0}
.comment p+p{margin-top:2px;color:var(--sub);font-size:12px}
.comment .umb{color:var(--indigo)}
.tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--ground);border-radius:999px;padding:3px}
.seg button{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:500;color:var(--sub);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.shuffle{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--indigo);padding:6px 0;white-space:nowrap}
.shuffle svg{width:15px;height:15px}

/* items */
.items{list-style:none;margin:6px 0 0;padding:0}
.items li{display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.items li:first-child{border-top:1px solid var(--line)}
.items .cat{font-size:12px;color:var(--sub)}
.items .nm{font-size:14px;font-weight:500;line-height:1.4}
.items .col{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);white-space:nowrap}
.items .sw{width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}

/* rain */
.rain{margin-top:14px;background:var(--indigo-pale);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
.rain svg{width:24px;height:24px;color:var(--indigo)}
.rain h3{margin:0;font-size:14px;color:var(--indigo)}
.rain p{margin:0;font-size:13px}
.rain p+p{margin-top:3px}

/* lower tabs */
.ltabs{display:grid;grid-template-columns:1fr 1fr;margin-top:10px;border-bottom:1px solid var(--line)}
.ltabs button{padding:8px 0;font-size:15px;font-weight:700;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px}
.ltabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.panel{padding-top:8px}
.sheet .lay{max-width:220px;margin:4px auto 0}
.sheet .rain{margin-top:12px}
.sheet .rain h3{margin:0}
.sheet .sub{font-size:13px;color:var(--sub);margin:0}
.hours{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin:0 -14px;padding-left:14px;padding-right:14px}
.hours::-webkit-scrollbar{display:none}
.hr{flex:none;width:56px;background:var(--paper);border-radius:14px;padding:7px 0 8px;text-align:center}
.hr .t{font-size:12px;color:var(--sub)}
.hr svg{width:26px;height:26px;margin:2px auto 0;display:block}
.hr .d{font-family:var(--num);font-stretch:80%;font-size:17px;font-weight:500}
.hr .p{font-size:11px;color:var(--indigo);min-height:16px}
.hr.now{box-shadow:inset 0 0 0 1.5px var(--ink)}

.week{list-style:none;margin:0;padding:0}
.week button{width:100%;display:grid;grid-template-columns:50px 30px 1fr auto;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;text-align:left}
.week button[aria-current="true"]{background:var(--paper)}
.week .day{font-size:14px;font-weight:500;line-height:1.25}
.week .day small{display:block;font-size:12px;color:var(--sub);font-weight:400}
.week .day.sat{color:#3A5A86}.week .day.sun{color:var(--warm)}
.week svg{width:28px;height:28px}
.week .fit{font-size:13px;line-height:1.35}
.week .fit small{display:block;color:var(--indigo);font-size:12px}
.week .tt{font-family:var(--num);font-stretch:80%;font-size:16px;text-align:right;white-space:nowrap}
.week .tt span{color:var(--sub);font-weight:300}

.notice{background:var(--paper);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--sub);margin:14px 0 0}
.foot{margin-top:30px;font-size:12px;color:var(--sub)}
.foot a{color:var(--sub)}
.skeleton{height:360px;border-radius:22px;background:var(--paper);display:grid;place-items:center;color:var(--sub);font-size:14px}

/* sheet */
.scrim{position:fixed;inset:0;visibility:hidden;background:rgba(30,38,41,.35);opacity:0;pointer-events:none;z-index:10}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:460px;margin:0 auto;
  background:var(--paper);border-radius:22px 22px 0 0;
  padding:10px 20px calc(env(safe-area-inset-bottom) + 24px);
  transform:translateY(105%);max-height:88vh;overflow-y:auto;visibility:hidden
}
.scrim,.sheet{transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1),visibility .3s}
.open .scrim{opacity:1;pointer-events:auto;visibility:visible}
.open .sheet{transform:none;visibility:visible}
.grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:17px;margin:0 0 4px}
.sheet h3{font-size:14px;margin:22px 0 8px}
.sheet .hint{font-size:12px;color:var(--sub);margin:6px 0 0}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn{padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--paper);font-size:14px;font-weight:500;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.results{list-style:none;margin:8px 0 0;padding:0}
.results button{width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line);font-size:15px}
.results small{color:var(--sub);margin-left:6px;font-size:12px}
.loc{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sens{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--ground);border-radius:12px;padding:4px}
.sens button{padding:9px 0;border-radius:9px;font-size:12px;color:var(--sub);line-height:1.3}
.sens button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.msg{font-size:13px;color:var(--warm);margin-top:8px;min-height:1em}

@media (max-width:350px){ .cols{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="head">
    <header class="top">
      <button class="place" id="placeBtn" aria-label="地点を変更">
        <b id="placeName">名古屋市</b>
        <span id="dateLabel"></span>
      </button>
      <button class="iconbtn" id="setBtn" aria-label="設定">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </header>
    <nav class="ptabs" id="ptabs" aria-label="表示する時間帯">
      <button data-view="today" aria-pressed="true">今日</button>
      <button data-view="tonight" aria-pressed="false">今夜</button>
      <button data-view="tomorrow" aria-pressed="false">明日</button>
    </nav>
  </div>

  <div id="main"><div class="skeleton">天気を読み込んでいます</div></div>

  <footer class="foot">
    天気データ：<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>（CC BY 4.0）。気温・天気は気象庁の数値予報モデル（MSM・GSM）、降水確率はOpen-Meteoの既定モデルによる値です。
  </footer>
</div>

<div id="itemWrap">
  <div class="scrim" id="itemScrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="itemTitle">
    <div class="grip"></div>
    <h2 id="itemTitle">コーデの詳細</h2>
    <div id="itemBody"></div>
    <div style="margin-top:18px"><button class="btn" id="itemClose" type="button" style="width:100%">閉じる</button></div>
  </div>
</div>
<div id="sheetWrap">
  <div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grip"></div>
    <h2 id="sheetTitle">設定</h2>

    <h3>地点</h3>
    <form class="search" id="searchForm">
      <input id="q" type="search" placeholder="市区町村名で検索（例：栄、京都市）" autocomplete="off" enterkeyhint="search">
      <button class="btn" type="submit">検索</button>
    </form>
    <ul class="results" id="results"></ul>
    <div class="loc">
      <button class="btn ghost" id="gpsBtn" type="button">現在地を使う</button>
    </div>
    <p class="msg" id="msg"></p>

    <h3>体感の好み</h3>
    <div class="sens" id="sens"></div>
    <p class="hint">暑がりにすると薄着寄り、寒がりにすると厚着寄りの提案になります。</p>

    <div style="margin-top:24px"><button class="btn" id="closeBtn" type="button" style="width:100%">閉じる</button></div>
  </div>
</div>

<script>
(() => {
const IS_PREVIEW = !/github\.io$/.test(location.hostname) && location.protocol !== 'file:';
/* ---------- storage ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('mt.'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('mt.'+k, JSON.stringify(v)); }catch(e){} }
};

const state = {
  place: store.get('place', {name:'名古屋市', admin:'愛知県', lat:35.1815, lon:136.9066}),
  style: store.get('style', 'kirei'),
  sens: store.get('sens', 0),
  view: {type:'today'},
  lower: store.get('lower','hours'),
  shuffle: 0,
  data: null,
  demo: false
};

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const WD = ['日','月','火','水','木','金','土'];
function hashStr(s){ let h=2166136261; for(const ch of s){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function rng(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const pick = (r, arr) => arr[Math.floor(r()*arr.length)];
function hexToRgb(h){ h=h.replace('#',''); return [0,2,4].map(i=>parseInt(h.substr(i,2),16)); }
function mix(hex, amt){ // amt<0 darker, >0 lighter
  const [r,g,b]=hexToRgb(hex); const t=amt<0?0:255; const p=Math.abs(amt);
  const f=v=>Math.round(v+(t-v)*p).toString(16).padStart(2,'0'); return '#'+f(r)+f(g)+f(b);
}
function lum(hex){ const [r,g,b]=hexToRgb(hex).map(v=>v/255); return .2126*r+.7152*g+.0722*b; }
const lc = c => lum(c) < .22 ? mix(c,.28) : mix(c,-.3);
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }

function levelOf(t){
  const th=[28,25,21,18,15,12,9,5];
  for(let i=0;i<th.length;i++) if(t>=th[i]) return i;
  return 8;
}

/* ---------- weather codes ---------- */
function wxInfo(code){
  if(code===0) return {t:'快晴',k:'sun'};
  if(code===1) return {t:'晴れ',k:'sun'};
  if(code===2) return {t:'晴れ時々くもり',k:'partly'};
  if(code===3) return {t:'くもり',k:'cloud'};
  if(code===45||code===48) return {t:'霧',k:'fog'};
  if(code>=51&&code<=57) return {t:'霧雨',k:'rain'};
  if(code===61) return {t:'弱い雨',k:'rain'};
  if(code===63) return {t:'雨',k:'rain'};
  if(code===65) return {t:'強い雨',k:'rain'};
  if(code===66||code===67) return {t:'みぞれ',k:'rain'};
  if(code>=71&&code<=77) return {t:'雪',k:'snow'};
  if(code>=80&&code<=82) return {t:'にわか雨',k:'rain'};
  if(code===85||code===86) return {t:'にわか雪',k:'snow'};
  if(code>=95) return {t:'雷雨',k:'storm'};
  return {t:'—',k:'cloud'};
}
function wxIcon(k, night){

  const moon = (cx,cy,r) => `<path d="M${cx+r*0.35} ${cy-r} A${r} ${r} 0 1 0 ${cx+r} ${cy+r*0.45} A${r*0.8} ${r*0.8} 0 1 1 ${cx+r*0.35} ${cy-r} Z" fill="${sun}"/>`;

/* ---------- outfit engine ---------- */
function buildOutfit(day, style, sens, seed){
  const r = rng(hashStr(`${day.key||day.date}|${style}|${seed}`));
  const eff = day.appMin*0.4 + day.appMax*0.6 + sens;
  let lv = levelOf(eff);
  const cat = style==='kirei' ? KIREI : CASUAL;
  const snow = day.snow;
  const rainy = day.pop>=50 || day.psum>=1 || day.kind==='rain' || day.kind==='storm';
  const heavy = day.pop>=70 || day.psum>=5;
  const used = new Set();
  const choose = (list) => {
    if(!list || !list.length) return null;
    const it = pick(r, list);
    const avail = it.colors.filter(c=>!used.has(c));
    const cn = pick(r, avail.length?avail:it.colors);
    used.add(cn);
    return {...it, colorName:cn, color:COL[cn]};
  };
  const o = {};
  // outer
  if(rainy && lv>=3 && lv<=6 && r()<0.75) o.outer = choose([RAIN[style].outer]);
  else o.outer = choose(cat.outer[lv]);
  o.top = choose(cat.top[lv]);
  // avoid shirt+shirt / knit+knit duplicate in inner
  let inners = (cat.inner[lv]||[]).filter(x=>x.shape!==o.top.shape);
  o.inner = inners.length ? choose(inners) : null;
  let bottoms = cat.bottom[lv];
  if(heavy){ const f=bottoms.filter(b=>b.shape!=='wide'); if(f.length) bottoms=f; }
  o.bottom = choose(bottoms);
  if(snow) o.shoes = choose([SNOW_SHOES[style]]);
  else if(rainy) o.shoes = choose(RAIN[style].shoes);
  else o.shoes = choose(cat.shoes[lv]);
  o.extras = [];
  // umbrella
  let umb = null;
  if(day.pop>=60 || day.psum>=3 || snow) umb = 'long';
  else if(day.pop>=30 || day.psum>=0.5) umb = 'fold';
  if(umb){
    const cn = pick(r, UMB_COL);
    o.extras.push({name: umb==='long'?'長傘':'折りたたみ傘', shape: umb==='long'?'umbrella':'fold', colorName:cn, color:COL[cn]});
  }
  const ex = (cat.extra[lv]||[]).filter(e => !(rainy && e.shape==='tote'));
  for(const e of ex){ if(o.extras.length>=2) break; o.extras.push(choose([e])); }
  // texts
  const notes = [];
  if(day.max - day.min >= 9) notes.push(`朝晩と日中で${Math.round(day.max-day.min)}℃差。脱ぎ着しやすい重ね方に。`);
  let rain = null;
  if(umb || rainy || snow){
    const lines = [];
    if(umb==='long') lines.push(`傘：降水確率${day.pop}%なので長傘を。` + (day.wind>=8 ? '風が強いので骨の丈夫なものを。' : ''));
    else if(umb==='fold') lines.push(`傘：降水確率${day.pop}%。折りたたみ傘をかばんに。`);
    if(snow) lines.push(`靴：雪で滑りやすいので、溝の深いソールのブーツを。`);
    else if(rainy) lines.push(`靴：${o.shoes.name}で。スエードや革底の靴は避けると安心。`);
    if(heavy) lines.push('パンツ：裾が広いと濡れやすいので、細身かくるぶし丈を選びました。');
    rain = {title: snow ? '雪の日の足元' : '雨の日の傘と靴', lines};
  }
  return {lv, eff, outfit:o, notes, rain, rainy};
}

/* ---------- flat-lay renderer (portrait, fits the right column) ---------- */
function place(item, slot, jitter){
  const g = G[item.shape](item.color, item.v);
  let w=g.w, h=g.h, rot=jitter;
  const tall = h/w > 2.2, slotWide = slot.w/slot.h > 1.4;
  if(tall && slotWide){ [w,h]=[h,w]; rot += -90; }
  const sc = Math.min(slot.w/w, slot.h/h) * 0.92;
  const cx = slot.x + slot.w/2, cy = slot.y + slot.h/2;
  return `<g filter="url(#sh)" transform="translate(${cx.toFixed(1)},${cy.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${sc.toFixed(3)}) translate(${(-g.w/2).toFixed(1)},${(-g.h/2).toFixed(1)})">${g.d}</g>`;
}
function renderLay(res, seed){
  const o = res.outfit; const r = rng(seed);
  const j = () => (r()-0.5)*7;
  const ex = o.extras.filter(Boolean).sort((p,q)=>{ const a=G[p.shape](p.color), b=G[q.shape](q.color); return (b.h/b.w)-(a.h/a.w); });
  let s;
  if(o.outer){
    s = { outer:{x:4,y:6,w:128,h:178}, top:{x:124,y:6,w:92,h:96}, bottom:{x:134,y:104,w:82,h:202},
          extra:{x:6,y:186,w:124,h:52}, shoes:{x:6,y:242,w:124,h:62} };
    if(!ex.length) s.shoes = {x:6,y:198,w:124,h:100};
  } else {
    s = { top:{x:4,y:8,w:132,h:138}, bottom:{x:136,y:6,w:80,h:298},
          extra:{x:6,y:150,w:126,h:70}, shoes:{x:6,y:226,w:126,h:76} };
    if(!ex.length){ s.top={x:4,y:10,w:132,h:164}; s.shoes={x:6,y:192,w:126,h:100}; }
  }
  let body = '';
  if(o.outer) body += place(o.outer, s.outer, j());
  body += place(o.top, s.top, j());
  body += place(o.bottom, s.bottom, j()*0.5);
  body += place(o.shoes, s.shoes, j()*0.5);
  if(ex.length===1) body += place(ex[0], s.extra, j());
  else if(ex.length===2){
    const e=s.extra;
    body += place(ex[0], {x:e.x,y:e.y,w:e.w*0.62,h:e.h}, j()) + place(ex[1], {x:e.x+e.w*0.62,y:e.y,w:e.w*0.38,h:e.h}, j());
  }
  let tex=''; const rr=rng(11);
  for(let i=0;i<54;i++){ const y=(rr()*310).toFixed(0); tex+=`M0 ${y}L220 ${y}`; }
  return `<svg viewBox="0 0 220 310" role="img" aria-label="コーデのイラスト">
    <defs><filter id="sh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="1.8" stdDeviation="1.8" flood-color="#1E2629" flood-opacity=".16"/></filter></defs>
    <rect width="220" height="310" fill="#D6DBD3"/>
    <path d="${tex}" stroke="#C9CFC6" stroke-width=".5" opacity=".7"/>
    ${body}
  </svg>`;
}

/* ---------- data ---------- */
async function getJSON(u, ms=15000){
  const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), ms);
  try{
    const res = await fetch(u, {cache:'no-store', signal:ctl.signal});
    if(!res.ok){ let why=''; try{ why=(await res.json()).reason||''; }catch(_){} throw new Error(`HTTP ${res.status} ${why}`.trim()); }
    return await res.json();
  } finally { clearTimeout(tm); }
}
// 気温・天気・湿度・風は気象庁モデル（MSM→GSM）を優先し、
// 気象庁モデルにない降水確率と欠けた値は既定モデル（best_match）で補う
async function fetchWeather(lat, lon){
  const mk = extra => { const u = new URL('https://api.open-meteo.com/v1/forecast'); u.search = new URLSearchParams({
    latitude:lat, longitude:lon, timezone:'Asia/Tokyo', forecast_days:'7', past_days:'1', wind_speed_unit:'ms',
    daily:'weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max',
    hourly:'temperature_2m,apparent_temperature,relative_humidity_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m',
    ...extra }); return u; };
  const jmaP = getJSON(mk({models:'jma_seamless'})).catch(()=>null);
  let raw;
  try{ raw = await getJSON(mk({})); }
  catch(e){ const j = await jmaP; if(j) return j; throw e; }
  // 気象庁モデルの応答は最大3秒だけ待つ（遅いときは既定モデルだけで表示）
  const jma = await Promise.race([jmaP, new Promise(r=>setTimeout(()=>r(null), 3000))]);
  if(jma) mergeInto(raw, jma);
  return raw;
}
function mergeInto(dst, src){
  for(const sec of ['daily','hourly']){
    const S = src[sec], D = dst[sec];
    if(!S || !D || !S.time || S.time.length !== D.time.length || S.time[0] !== D.time[0]) continue;
    for(const k in S){
      if(k === 'time' || k.includes('probability') || !Array.isArray(D[k]) || !Array.isArray(S[k])) continue;
      D[k] = D[k].map((v,i) => S[k][i] != null ? S[k][i] : v);
    }
  }
  dst.jma = true;
}
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
function normalize(j){
  const d=j.daily, h=j.hourly;
  const hours = h.time.map((t,i)=>({time:t, date:t.slice(0,10), hh:+t.slice(11,13),
    temp:h.temperature_2m[i], app:h.apparent_temperature[i], hum:h.relative_humidity_2m[i],
    pop:h.precipitation_probability[i]??0, prec:h.precipitation[i]??0, code:h.weather_code[i], wind:h.wind_speed_10m[i]??0}));
  const all = d.time.map((t,i)=>{
    const k = wxInfo(d.weather_code[i]);
    const hs = hours.filter(x=>x.date===t);
    return { date:t, key:t, code:d.weather_code[i], label:k.t, kind:k.k,
      max:d.temperature_2m_max[i], min:d.temperature_2m_min[i],
      appMax:d.apparent_temperature_max[i], appMin:d.apparent_temperature_min[i],
      pop:d.precipitation_probability_max[i]??0, psum:d.precipitation_sum[i]??0, wind:d.wind_speed_10m_max[i]??0,
      hum: Math.round(avg(hs.map(x=>x.hum).filter(v=>v!=null))), snow: k.k==='snow', night:false };
  });
  // 天気予報の慣例に合わせる：最低気温は0〜9時、最高気温は9〜18時
  for(const day of all){
    const hs = hours.filter(x=>x.date===day.date && x.temp!=null);
    const morn = hs.filter(x=>x.hh<=9), noon = hs.filter(x=>x.hh>=9 && x.hh<=18);
    if(morn.length>=9 && noon.length>=9){
      day.min = Math.min(...morn.map(x=>x.temp)); day.max = Math.max(...noon.map(x=>x.temp));
      const ma = morn.map(x=>x.app).filter(v=>v!=null), na = noon.map(x=>x.app).filter(v=>v!=null);
      if(ma.length && na.length){ day.appMin = Math.min(...ma); day.appMax = Math.max(...na); }
    }
  }
  for(let i=1;i<all.length;i++){ all[i].dMax = all[i].max-all[i-1].max; all[i].dMin = all[i].min-all[i-1].min; }
  const n = new Date(); const today = `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
  let ti = all.findIndex(x=>x.date===today); if(ti<1) ti = 1;
  return {days: all.slice(ti), hours, fetchedAt: new Date()};
}
function tonightOf(data){
  const d0 = data.days[0];
  const hs = data.hours.filter(x=>x.date===d0.date && x.hh>=18);
  if(!hs.length) return {...d0, night:true, key:d0.date+'n'};
  const wet = hs.filter(x=>x.prec>=0.2 || x.code>=51);
  const code = wet.length ? Math.max(...wet.map(x=>x.code)) : Math.max(...hs.map(x=>Math.min(x.code,3)));
  const k = wxInfo(code);
  const t = hs.map(x=>x.temp), a = hs.map(x=>x.app);
  return { date:d0.date, key:d0.date+'n', code, label:k.t, kind:k.k,
    max:Math.max(...t), min:Math.min(...t), appMax:Math.max(...a), appMin:Math.min(...a),
    pop:Math.max(...hs.map(x=>x.pop)), psum:hs.reduce((s,x)=>s+x.prec,0), wind:Math.max(...hs.map(x=>x.wind)),
    hum:Math.round(avg(hs.map(x=>x.hum))), snow:k.k==='snow', night:true,
    t18:hs[0].temp, tLast:hs[hs.length-1].temp };
}
function demoData(){
  const base = new Date(); const daily={time:[],weather_code:[],temperature_2m_max:[],temperature_2m_min:[],apparent_temperature_max:[],apparent_temperature_min:[],precipitation_probability_max:[],precipitation_sum:[],wind_speed_10m_max:[]};
  const hourly={time:[],temperature_2m:[],apparent_temperature:[],relative_humidity_2m:[],precipitation_probability:[],precipitation:[],weather_code:[],wind_speed_10m:[]};
  const plan = [[16,10,3,10,0],[20,12,3,0,0],[15,8,61,70,4],[14,7,3,30,0.2],[16,6,0,0,0],[13,5,1,10,0],[11,3,3,40,0.6],[12,4,0,0,0]];
  plan.forEach((p,i)=>{
    const dt = new Date(base.getFullYear(), base.getMonth(), base.getDate()+i-1);
    const ds = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
    daily.time.push(ds); daily.weather_code.push(p[2]); daily.temperature_2m_max.push(p[0]); daily.temperature_2m_min.push(p[1]);
    daily.apparent_temperature_max.push(p[0]-2); daily.apparent_temperature_min.push(p[1]-3);
    daily.precipitation_probability_max.push(p[3]); daily.precipitation_sum.push(p[4]); daily.wind_speed_10m_max.push(4+i%3);
    for(let hh=0;hh<24;hh++){
      const t = p[1] + (p[0]-p[1]) * Math.max(0, Math.sin((hh-6)/16*Math.PI));
      hourly.time.push(`${ds}T${String(hh).padStart(2,'0')}:00`); hourly.temperature_2m.push(t); hourly.apparent_temperature.push(t-2.5);
      hourly.relative_humidity_2m.push(Math.round(70 - 20*Math.max(0, Math.sin((hh-6)/16*Math.PI)) + (p[3]>50?15:0)));
      const pp = p[3] ? Math.round(p[3]*(0.5+0.5*Math.sin(hh/4))) : 0;
      hourly.precipitation_probability.push(pp); hourly.precipitation.push(p[4] ? +(p[4]/24*(pp/p[3])*2).toFixed(1) : 0);
      hourly.weather_code.push(p[2]===61 && pp<40 ? 3 : p[2]); hourly.wind_speed_10m.push(3);
    }
  });
  return normalize({daily, hourly});
}

/* ---------- render ---------- */
const CAT = {outer:'アウター', top:'トップス', inner:'インナー', bottom:'ボトムス', shoes:'シューズ'};
function fmtDay(ds){ const d=parseDate(ds); return `${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`; }
function shortFit(o){
  const a = [];
  if(o.outer) a.push(o.outer.name.replace(/^(コットンの|ウールの|厚手ウールの|撥水)/,''));
  a.push(o.top.name.replace(/^(上質コットンの|リネンの)/,''));
  return a.join('＋');
}
const signed = v => v==null ? '' : (Math.round(v)>0 ? '+' : Math.round(v)<0 ? '−' : '±') + Math.abs(Math.round(v));
function periodFor(){
  const v = state.view, data = state.data;
  if(v.type==='tonight') return tonightOf(data);
  if(v.type==='tomorrow') return data.days[1];
  if(v.type==='day') return data.days[v.i];
  return data.days[0];
}
function hoursFor(p){
  const H = state.data.hours;
  if(state.view.type==='today'){
    const now = new Date(); const ds = state.data.days[0].date;
    const idx = H.findIndex(h=>h.date===ds && h.hh===now.getHours());
    return H.slice(Math.max(0,idx), Math.max(0,idx)+24);
  }
  if(p.night){
    const idx = H.findIndex(h=>h.date===p.date && h.hh===18);
    return H.slice(idx, idx+12);
  }
  return H.filter(h=>h.date===p.date && h.hh>=5);
}
function render(){
  const data = state.data; if(!data) return;
  const p = periodFor();
  const res = buildOutfit(p, state.style, state.sens, state.shuffle);
  const o = res.outfit;
  const upd = data.fetchedAt ? `${data.fetchedAt.getHours()}:${String(data.fetchedAt.getMinutes()).padStart(2,'0')} 更新` : '';
  $('#dateLabel').textContent = `${fmtDay(data.days[0].date)}　${state.demo ? 'サンプル表示' : upd}`;
  $('#placeName').textContent = state.place.name;
  document.querySelectorAll('#ptabs [data-view]').forEach(b=> b.setAttribute('aria-pressed', String(b.dataset.view===state.view.type)));

  const when = p.night ? `今夜　18時〜24時` : (state.view.type==='today' ? 'きょう　' : state.view.type==='tomorrow' ? 'あした　' : '') + fmtDay(p.date);
  const temps = p.night
    ? `<div><span class="cap">18時</span><b>${Math.round(p.t18)}°</b></div><div class="lo"><span class="cap">24時ごろ</span><b>${Math.round(p.tLast)}°</b></div>`
    : `<div><b>${Math.round(p.max)}°</b><small class="${Math.round(p.dMax)>0?'up':Math.round(p.dMax)<0?'dn':''}">${p.dMax!=null?'['+signed(p.dMax)+']':''}</small></div>
       <div class="lo"><b>${Math.round(p.min)}°</b><small class="${Math.round(p.dMin)>0?'up':Math.round(p.dMin)<0?'dn':''}">${p.dMin!=null?'['+signed(p.dMin)+']':''}</small></div>`;

  const rows = [];
  for(const k of ['outer','top','inner','bottom','shoes']){
    const it = o[k]; if(!it) continue;
    rows.push(`<li><span class="cat">${CAT[k]}</span><span class="nm">${it.name}</span><span class="col"><i class="sw" style="background:${it.color}"></i>${it.colorName}</span></li>`);
  }
  for(const e of o.extras.filter(Boolean))
    rows.push(`<li><span class="cat">小物</span><span class="nm">${e.name}</span><span class="col"><i class="sw" style="background:${e.color}"></i>${e.colorName}</span></li>`);

  let panel = '';
  if(state.lower==='hours'){
    const hrs = hoursFor(p);
    panel = `<div class="hours">${hrs.map((h,ix)=>`<div class="hr${state.view.type==='today'&&ix===0?' now':''}"><div class="t">${state.view.type==='today'&&ix===0?'今':h.hh+'時'}</div>${wxIcon(wxInfo(h.code).k, h.hh>=18||h.hh<6)}<div class="d">${Math.round(h.temp)}°</div><div class="p">${h.pop>=20?h.pop+'%':''}</div></div>`).join('')}</div>`;
  } else {
    const cur = state.view.type==='today'||state.view.type==='tonight' ? 0 : state.view.type==='tomorrow' ? 1 : state.view.i;
    panel = `<ul class="week">${data.days.map((d,i)=>{
      const rr = buildOutfit(d, state.style, state.sens, 0);
      const dt = parseDate(d.date); const wd = dt.getDay();
      const umb = rr.outfit.extras.find(e=>e && (e.shape==='umbrella'||e.shape==='fold'));
      return `<li><button data-i="${i}" aria-current="${i===cur}">
        <span class="day ${wd===6?'sat':wd===0?'sun':''}">${i===0?'きょう':i===1?'あした':WD[wd]+'曜'}<small>${dt.getMonth()+1}/${dt.getDate()}</small></span>
        ${wxIcon(d.kind)}
        <span class="fit">${shortFit(rr.outfit)}${umb?`<small>${umb.name}・降水${d.pop}%</small>`:''}</span>
        <span class="tt">${Math.round(d.max)}° <span>${Math.round(d.min)}°</span></span>
      </button></li>`; }).join('')}</ul>`;
  }

  const layHtml = renderLay(res, hashStr(p.key+state.style+state.shuffle));
  const umbItem = o.extras.find(e=>e && (e.shape==='umbrella'||e.shape==='fold'));
  $('#itemBody').innerHTML = `
    <p class="sub">${when}　${state.style==='kirei'?'きれいめリラックス':'カジュアル'}</p>
    <div class="lay">${layHtml}</div>
    <ul class="items">${rows.join('')}</ul>
    ${res.rain ? `<div class="rain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12a9 9 0 0 1 18 0Z"/><path d="M12 12v7a2 2 0 0 1-4 0"/></svg><div><h3>${res.rain.title}</h3>${res.rain.lines.map(l=>`<p>${l}</p>`).join('')}</div></div>` : ''}`;
  $('#main').innerHTML = `
    <div class="card">
      <div class="when">${when}</div>
      <div class="cols">
        <div class="left">
          <div class="wxhead">${wxIcon(p.kind, p.night)}<div class="label">${p.label}</div></div>
          <div class="temps">${temps}</div>
          <dl class="stats">
            <div class="pop"><dt>降水確率</dt><dd>${p.pop}<small>%</small></dd></div>
            <div><dt>湿度</dt><dd>${isFinite(p.hum)?p.hum:'—'}<small>%</small></dd></div>
            <div><dt>体感</dt><dd>${Math.round(res.eff)}<small>°</small></dd></div>
            <div><dt>風速</dt><dd>${Math.round(p.wind)}<small>m/s</small></dd></div>
          </dl>
        </div>
        <button class="lay" id="layBtn" aria-label="アイテムと色の詳細を見る">${layHtml}<span class="more">詳細</span></button>
      </div>
      <div class="comment"><p>${LEVEL_TEXT[res.lv]}</p>${res.notes.map(n=>`<p>${n}</p>`).join('')}${umbItem?`<p class="umb">${umbItem.name}を持って出かけましょう（降水確率${p.pop}%）</p>`:''}</div>
      <div class="tools">
        <div class="seg" role="group" aria-label="スタイル">
          <button data-style="kirei" aria-pressed="${state.style==='kirei'}">きれいめ</button>
          <button data-style="casual" aria-pressed="${state.style==='casual'}">カジュアル</button>
        </div>
        <button class="shuffle" id="shuffleBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>別のコーデ</button>
      </div>
    </div>
    <div class="ltabs" role="tablist">
      <button role="tab" data-lower="hours" aria-selected="${state.lower==='hours'}">1時間ごと</button>
      <button role="tab" data-lower="week" aria-selected="${state.lower==='week'}">週間コーデ</button>
    </div>
    <div class="panel" role="tabpanel">${panel}</div>
    ${state.demo ? (IS_PREVIEW
      ? `<p class="notice">claude.aiのプレビューでは天気を取得できないため、サンプルの天気で表示しています。実際の予報は <a href="https://immasaki.github.io/fuku-to-tenki/" target="_blank" rel="noopener">immasaki.github.io/fuku-to-tenki</a> で見られます。</p>`
      : `<div class="notice"><p style="margin:0">天気を取得できなかったため、サンプルの天気で表示しています。</p><p style="margin:4px 0 8px;font-size:12px">理由：${state.err||'不明'}</p><button class="btn ghost" id="retryBtn" type="button">もう一度読み込む</button></div>`) : ''}
  `;
}

/* ---------- events ---------- */
$('#ptabs').addEventListener('click', e=>{
  const b = e.target.closest('[data-view]'); if(!b) return;
  state.view = {type:b.dataset.view}; state.shuffle=0; render();
});
$('#main').addEventListener('click', e => {
  const s = e.target.closest('[data-style]');
  if(s){ state.style = s.dataset.style; state.shuffle=0; store.set('style', state.style); render(); return; }
  if(e.target.closest('#shuffleBtn')){ state.shuffle++; render(); return; }
  if(e.target.closest('#layBtn')){ itemWrap.classList.add('open'); return; }
  if(e.target.closest('#retryBtn')){ e.target.textContent='読み込んでいます…'; load(); return; }
  const l = e.target.closest('[data-lower]');
  if(l){ state.lower = l.dataset.lower; store.set('lower', state.lower); render(); return; }
  const w = e.target.closest('[data-i]');
  if(w){ const i=+w.dataset.i; state.view = i===0?{type:'today'}: i===1?{type:'tomorrow'}:{type:'day', i}; state.shuffle=0; render();
    window.scrollTo({top:0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); }
});

const SENS = [[-3,'寒がり'],[-1.5,'やや\n寒がり'],[0,'ふつう'],[1.5,'やや\n暑がり'],[3,'暑がり']];
function renderSens(){
  $('#sens').innerHTML = SENS.map(([v,l])=>`<button data-v="${v}" aria-pressed="${state.sens===v}">${l.replace('\n','<br>')}</button>`).join('');
}
$('#sens').addEventListener('click', e=>{
  const b=e.target.closest('[data-v]'); if(!b) return;
  state.sens = +b.dataset.v; store.set('sens', state.sens); renderSens(); render();
});
const wrap = $('#sheetWrap');
const openSheet = () => { wrap.classList.add('open'); renderSens(); $('#msg').textContent=''; };
const closeSheet = () => wrap.classList.remove('open');
$('#setBtn').onclick = openSheet; $('#placeBtn').onclick = openSheet;
$('#scrim').onclick = closeSheet; $('#closeBtn').onclick = closeSheet;
const itemWrap = $('#itemWrap');
const closeItems = () => itemWrap.classList.remove('open');
$('#itemScrim').onclick = closeItems; $('#itemClose').onclick = closeItems;
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeSheet(); closeItems(); } });

$('#searchForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const q = $('#q').value.trim(); if(!q) return;
  $('#msg').textContent = '検索しています…'; $('#results').innerHTML='';
  try{
    const u = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=10&language=ja&format=json&countryCode=JP`;
    const j = await (await fetch(u)).json();
    const list = j.results || [];
    $('#msg').textContent = list.length ? '' : `「${q}」に一致する地点が見つかりません。市区町村名で試してください。`;
    $('#results').innerHTML = list.map((p,i)=>`<li><button data-p="${i}">${p.name}<small>${[p.admin1,p.admin2].filter(Boolean).join(' ')}</small></button></li>`).join('');
    $('#results').onclick = ev => {
      const b = ev.target.closest('[data-p]'); if(!b) return;
      const p = list[+b.dataset.p];
      setPlace({name:p.name, admin:p.admin1||'', lat:p.latitude, lon:p.longitude});
    };
  }catch(err){ $('#msg').textContent = '地点を検索できませんでした。通信状況を確認してもう一度試してください。'; }
});
$('#gpsBtn').onclick = () => {
  if(!navigator.geolocation){ $('#msg').textContent='この環境では現在地を取得できません。地点名で検索してください。'; return; }
  $('#msg').textContent = '現在地を取得しています…';
  navigator.geolocation.getCurrentPosition(
    pos => setPlace({name:'現在地', admin:'', lat:+pos.coords.latitude.toFixed(4), lon:+pos.coords.longitude.toFixed(4)}),
    () => { $('#msg').textContent='現在地を取得できませんでした。位置情報の許可を確認するか、地点名で検索してください。'; },
    {timeout:10000, maximumAge:600000}
  );
};
function setPlace(p){
  state.place = p; store.set('place', p); state.view={type:'today'}; state.shuffle=0;
  state.data = null; $('#main').innerHTML = '<div class="skeleton">天気を読み込んでいます</div>';
  $('#results').innerHTML=''; $('#q').value=''; closeSheet(); load();
}

async function load(){
  $('#placeName').textContent = state.place.name;
  const key = `${state.place.lat},${state.place.lon}`;
  // show the last forecast right away, then refresh in the background
  const cached = store.get('wx', null);
  if(!state.data && cached && cached.key===key && Date.now()-cached.at < 36*3600*1000){
    try{ state.data = normalize(cached.raw); state.data.fetchedAt = new Date(cached.at); state.demo = false; render(); }catch(e){}
  }
  try{
    let raw;
    try{ raw = await fetchWeather(state.place.lat, state.place.lon); }
    catch(first){ await new Promise(r=>setTimeout(r, 1000)); raw = await fetchWeather(state.place.lat, state.place.lon); }
    store.set('wx', {key, raw, at:Date.now()});
    state.data = normalize(raw); state.demo = false;
  }catch(e){
    state.err = e && e.name==='AbortError' ? '通信がタイムアウトしました（15秒×2回）' : (e && e.message) || String(e);
    if(!state.data){ state.data = demoData(); state.demo = true; }
  }
  render();
}
load();
// refresh when returning to the app after a while
let hiddenAt = 0;
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) hiddenAt = Date.now();
  else if(hiddenAt && Date.now()-hiddenAt > 30*60*1000) load();
});
// keep the app shell on the phone so it opens without waiting for the network
if('serviceWorker' in navigator && location.protocol==='https:' && location.hostname.endsWith('github.io')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
})();
